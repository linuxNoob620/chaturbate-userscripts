name: Validate userscripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Userscript releases must not implicitly rebuild frozen extension targets.
      - run: npm run build:userscript
      - run: npm run test:userscript
      - run: node ./tools/test-extension-adapters.mjs
