name: Validate userscripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./tools/validate-userscripts.mjs
      - run: node ./tools/test-github-sync.mjs
      - run: npm run build
      - run: node ./tools/test-extension-adapters.mjs
